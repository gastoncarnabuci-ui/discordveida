name: Ejecutar Bot Temporalmente

on:
  workflow_dispatch: # Permite iniciarlo manualmente desde la pestaña Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Máximo permitido por GitHub (casi 6 horas)

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema (FFmpeg para voz)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar librerías de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Iniciar el bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python main.py
    
