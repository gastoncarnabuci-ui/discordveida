[project]
name = "discord-answers-bot"
version = "0.1.0"
description = "A sarcastic Spanish-language Discord bot that answers questions with care."
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "google-genai>=3.3.0",
]

[project.scripts]
discord-answers-bot = "discord_bot:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "discord_bot"
module-root = "src"
